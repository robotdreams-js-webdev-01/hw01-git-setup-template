name: CI – HW01

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Függőségek telepítése
        run: npm install

      - name: Rejtett tesztek előkészítése
        env:
          HIDDEN_TEST_B64: ${{ secrets.HIDDEN_TEST_HW01 }}
        run: |
          mkdir -p .hidden-tests/hw01
          if [ -n "$HIDDEN_TEST_B64" ]; then
            echo "$HIDDEN_TEST_B64" | base64 -d > .hidden-tests/hw01/hw01.spec.js
            echo "✅ Rejtett tesztek betöltve."
          else
            echo "ℹ️ HIDDEN_TEST_HW01 secret nincs beállítva – csak alapvető tesztek futnak."
          fi

      - name: Tesztek futtatása
        run: npm test

      - name: Teszt eredmények feltöltése (pontozáshoz)
        if: always()
        run: |
          if [ ! -f jest-results.json ]; then
            echo '{"numPassedTests":0,"numTotalTests":0}' > jest-results.json
          fi
      - name: Eredmény artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: jest-results.json

  score:
    needs: build-and-test
    if: always() && needs.build-and-test.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Teszt eredmények letöltése
        uses: actions/download-artifact@v4
        with:
          name: test-results
      - name: Eredmények a pontozó számára
        run: cp test-results/jest-results.json ./jest-results.json 2>/dev/null || echo '{"numPassedTests":0,"numTotalTests":0}' > jest-results.json

      - name: '📊 Pontozás és PR komment'
        if: always()
        env:
          HW_ID: hw01
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node .github/scripts/computeScore.cjs

      - name: Pontszám feltöltése artifactként
        uses: actions/upload-artifact@v4
        with:
          name: hw01-score
          path: hw01-score.json
          retention-days: 90
